<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Course Registration Form</h1>
        <p>Register for your desired courses below.</p>
        
        <form id="registrationForm">
            <fieldset>
                <legend>Your Details</legend>
                
                <div class="form-group">
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <div class="form-group">
                    <label for="learningMode">Learning Mode:</label>
                    <select id="learningMode" name="learningMode" required>
                        <option value="">Choose one</option>
                        <option value="online">Online</option>
                        <option value="inperson">In Person</option>
                        <option value="hybrid">Hybrid</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Select Courses</legend>
                
                <div class="course-group">
                    <label>
                        <input type="checkbox" name="courses" value="frontend">
                        Full Stack Development - ₹18,000
                    </label>
                </div>

                <div class="course-group">
                    <label>
                        <input type="checkbox" name="courses" value="uiux">
                        UI / UX Design - ₹12,000
                    </label>
                </div>

                <div class="course-group">
                    <label>
                        <input type="checkbox" name="courses" value="dsa">
                        Data Structures & Algorithms - ₹15,000
                    </label>
                </div>

                <div class="course-group">
                    <label>
                        <input type="checkbox" name="courses" value="cloud">
                        Cloud Fundamentals - ₹14,000
                    </label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Additional Information</legend>
                
                <div class="form-group">
                    <label for="startDate">Preferred Start Date:</label>
                    <input type="date" id="startDate" name="startDate">
                </div>

                <div class="form-group">
                    <label for="experience">Current Experience:</label>
                    <select id="experience" name="experience">
                        <option value="beginner">Just getting started</option>
                        <option value="intermediate">Some experience</option>
                        <option value="advanced">Working professional</option>
                    </select>
                </div>
            </fieldset>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">Register</button>
                <button type="reset" class="btn btn-secondary">Clear</button>
            </div>

            <p id="successMessage" class="message"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
