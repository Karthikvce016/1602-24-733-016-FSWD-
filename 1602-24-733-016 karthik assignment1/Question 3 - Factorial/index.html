<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Factorial Calculator</h1>
        <p>Enter a number to calculate its factorial.</p>
        
        <div class="form-box">
            <div class="form-group">
                <label for="number">Enter a number:</label>
                <input type="number" id="number" name="number" min="0" max="20">
            </div>

            <button onclick="calculateFactorial()" class="btn btn-primary">Calculate</button>
        </div>

        <div id="result" class="result-box"></div>
        
        <div class="info-box">
            <h3>How Factorial Works:</h3>
            <p><strong>Factorial (n!):</strong> The product of all positive integers less than or equal to n.</p>
            <p><strong>Example:</strong> 5! = 5 × 4 × 3 × 2 × 1 = 120</p>
            <p><strong>Special case:</strong> 0! = 1</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
