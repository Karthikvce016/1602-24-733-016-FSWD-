<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Service Feedback | Assignment 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="feedback-page">
      <section class="container py-5">
        <div class="page-intro">
          <span class="assignment-tag">ASSIGNMENT 02 / HTML FORM</span>
          <h1>Help us make the<br /><em>experience better.</em></h1>
          <p>Your feedback helps us understand what’s working and where we can improve.</p>
        </div>

        <form class="feedback-card" id="feedbackForm" novalidate>
          <div class="form-title-row">
            <div><span class="form-icon">✦</span><h2>Send feedback about our service</h2></div>
            <span class="form-number">02</span>
          </div>

          <div class="row g-4">
            <div class="col-md-4"><label for="name">Name</label><input class="form-control field-blue" id="name" type="text" placeholder="your name" required /></div>
            <div class="col-md-4"><label for="email">E-mail</label><input class="form-control field-green" id="email" type="email" placeholder="your email" required /></div>
            <div class="col-md-4"><label for="phone">Phone</label><input class="form-control field-yellow" id="phone" type="tel" placeholder="your phone" /></div>
            <div class="col-md-7"><label for="subject">Subject</label><select class="form-select field-pink" id="subject"><option>General inquiry</option><option>Product feedback</option><option>Technical support</option><option>Something else</option></select></div>
            <fieldset class="col-md-5 rating-field"><legend>Rate our service</legend><div class="rating-options"><label><input type="radio" name="rating" value="good" required /> <span>Good</span></label><label><input type="radio" name="rating" value="average" /> <span>Average</span></label><label><input type="radio" name="rating" value="poor" /> <span>Poor</span></label></div></fieldset>
            <div class="col-12"><label for="comment">Comment</label><textarea class="form-control field-mint" id="comment" rows="4" placeholder="your comment" required></textarea></div>
          </div>

          <div class="form-footer">
            <label class="subscribe"><input type="checkbox" id="subscribe" /> <span>Subscribe to newsletter</span></label>
            <div class="actions"><button class="btn btn-send" type="submit">Send <span>↗</span></button><button class="btn btn-light" type="reset">Reset</button><button class="btn btn-light" id="cancelButton" type="button">Cancel</button></div>
          </div>
          <p class="status-message" id="statusMessage" role="status"></p>
        </form>
      </section>
    </main>
    <script>
      const feedbackForm = document.querySelector("#feedbackForm");
      const statusMessage = document.querySelector("#statusMessage");
      feedbackForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!feedbackForm.checkValidity()) { feedbackForm.classList.add("was-validated"); return; }
        statusMessage.textContent = "Thanks for sharing your feedback — we appreciate it.";
      });
      feedbackForm.addEventListener("reset", () => { statusMessage.textContent = ""; feedbackForm.classList.remove("was-validated"); });
      document.querySelector("#cancelButton").addEventListener("click", () => { feedbackForm.reset(); statusMessage.textContent = "Form cancelled."; });
    </script>
  </body>
</html>
