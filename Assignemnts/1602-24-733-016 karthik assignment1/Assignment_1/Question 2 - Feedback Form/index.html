<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Service Feedback Form</h1>
        <p>Help us improve by sharing your feedback.</p>
        
        <form id="feedbackForm">
            <fieldset>
                <legend>Your Information</legend>
                
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone">
                </div>
            </fieldset>

            <fieldset>
                <legend>Feedback Details</legend>
                
                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <select id="subject" name="subject" required>
                        <option value="">Choose a subject</option>
                        <option value="general">General Inquiry</option>
                        <option value="product">Product Feedback</option>
                        <option value="service">Service Quality</option>
                        <option value="complaint">Complaint</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Rate Our Service:</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="rating" value="excellent" required>
                            Excellent
                        </label>
                        <label>
                            <input type="radio" name="rating" value="good" required>
                            Good
                        </label>
                        <label>
                            <input type="radio" name="rating" value="average" required>
                            Average
                        </label>
                        <label>
                            <input type="radio" name="rating" value="poor" required>
                            Poor
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comment">Comments:</label>
                    <textarea id="comment" name="comment" rows="5" required></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>Preferences</legend>
                
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="subscribe" value="yes">
                        Subscribe to newsletter
                    </label>
                </div>
            </fieldset>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">Send Feedback</button>
                <button type="reset" class="btn btn-secondary">Clear</button>
            </div>

            <p id="statusMessage" class="message"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
