<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1 - Welcome Component</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function WelcomeFunctional(props) {
            return (
                <div className="card">
                    <h2>Welcome, {props.name}!</h2>
                    <p>This is rendered using a functional component.</p>
                </div>
            );
        }

        class WelcomeClass extends React.Component {
            render() {
                return (
                    <div className="card">
                        <h2>Welcome, {this.props.name}!</h2>
                        <p>This is rendered using a class component.</p>
                    </div>
                );
            }
        }

        function App() {
            return (
                <div className="container">
                    <h1>React Welcome Components</h1>
                    <WelcomeFunctional name="Karthik" />
                    <WelcomeClass name="Karthik" />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
